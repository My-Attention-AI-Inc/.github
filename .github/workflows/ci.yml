# Pull requests run the short check; main runs the full check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@f940b259c384998ebb9b5e4d18ea6c8e48d06d7b # v0.6.66
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
      tool-assets: .github/ci-tools.json
